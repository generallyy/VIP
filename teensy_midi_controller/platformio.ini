[platformio]
default_envs = teensy40

[env:teensy40]
platform = teensy @ 6.0.0
board = teensy40
framework = arduino
build_unflags = -std=gnu++14
build_flags =
    -std=gnu++17
    -D USB_MIDI_SERIAL
monitor_speed = 115200

; Compile-check the optional controls as well as the default wiring.
[env:teensy40_all_features]
extends = env:teensy40
build_flags =
    ${env:teensy40.build_flags}
    -D MIDI_ENABLE_REVERB=1
    -D MIDI_ENABLE_VOICING=1


